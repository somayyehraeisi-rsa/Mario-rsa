<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Plumber Bros</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #050409;
  }

  .scene {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Frame keeps the exact 1376x768 aspect ratio of the artwork so the
     Start Game hotspot below always lines up with the button painted
     into the image, at any viewport size. */
  .frame {
    position: relative;
    width: 100%;
    max-width: 1376px;
    aspect-ratio: 1376 / 768;
  }

  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Clickable hotspot placed exactly over the "START GAME" panel that's
     painted into the artwork, sized/positioned as % of the frame. */
  .start-hotspot {
    position: absolute;
    left: 35.97%;
    top: 58.85%;
    width: 27.62%;
    height: 12.11%;
    background: transparent;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
    transition: filter 0.15s ease, transform 0.08s ease;
  }

  .start-hotspot:hover {
    filter: drop-shadow(0 0 14px rgba(214, 52, 71, 0.9)) brightness(1.15);
  }

  .start-hotspot:active {
    transform: scale(0.97);
  }

  .start-hotspot:focus-visible {
    outline: 3px solid #b98cff;
    outline-offset: 4px;
  }

  .hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 2.5%;
    text-align: center;
    color: #8a8398;
    font-family: 'Courier New', monospace;
    font-size: clamp(10px, 1.4vw, 13px);
    letter-spacing: 0.02em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

<div class="scene">
  <div class="frame">
    <img src="assets/home-screen.jpg" alt="Super Plumber Bros — A Dark Descent" width="1376" height="768">
    <button class="start-hotspot" type="button" aria-label="Start Game"></button>
    <div class="hint">Move: &larr; &rarr; / A D &nbsp;|&nbsp; Jump: Space / &uarr; / W</div>
  </div>
</div>

<script>
  document.querySelector('.start-hotspot').addEventListener('click', () => {
    window.location.href = 'mario.html';
  });
</script>
</body>
</html>
