<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Plumber Bros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #05040a;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    overflow: hidden;
  }

  .scene {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(ellipse at 50% 18%, rgba(226, 220, 180, 0.10), transparent 45%),
      linear-gradient(180deg, #05040a 0%, #0d0a1f 55%, #1a1230 100%);
  }

  /* comic halftone dot texture, denser toward the bottom like ink shading */
  .scene::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(214, 52, 71, 0.35) 1.3px, transparent 1.3px);
    background-size: 14px 14px;
    background-position: 0 0;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.6) 55%, rgba(0,0,0,0.9) 100%);
            mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.6) 55%, rgba(0,0,0,0.9) 100%);
  }

  /* comic "impact burst" spokes behind the title */
  .burst {
    position: absolute;
    top: 6%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translate(-50%, -35%);
    background: repeating-conic-gradient(
      rgba(143, 45, 86, 0.16) 0deg 4deg,
      transparent 4deg 12deg
    );
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%);
            mask-image: radial-gradient(circle, #000 0%, transparent 62%);
    pointer-events: none;
  }

  .panel {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 520px;
    width: 100%;
  }

  .title {
    font-family: 'Bangers', cursive;
    letter-spacing: 3px;
    text-align: center;
    line-height: 0.95;
    font-size: clamp(38px, 9vw, 64px);
    color: #d63447;
    -webkit-text-stroke: 2.5px #000;
    text-shadow:
      3px 3px 0 #000,
      0 0 14px rgba(214, 52, 71, 0.65),
      0 0 34px rgba(143, 45, 86, 0.55);
  }

  .subtitle-tag {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #b98cff;
    text-shadow: 0 0 8px rgba(185, 140, 255, 0.6);
  }

  #hero {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.7));
  }

  /* chunky, embossed comic-book button */
  .start-btn {
    font-family: 'Bangers', cursive;
    font-size: 26px;
    letter-spacing: 3px;
    color: #fff0f0;
    background: linear-gradient(180deg, #e0455e 0%, #b23a52 45%, #7a1c3e 100%);
    border: 4px solid #05040a;
    border-radius: 10px;
    padding: 14px 46px 16px;
    cursor: pointer;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45);
    box-shadow:
      inset 0 3px 0 rgba(255, 255, 255, 0.35),
      inset 0 -7px 10px rgba(0, 0, 0, 0.35),
      0 9px 0 #3a0d20,
      0 9px 0 1px #000,
      0 18px 28px rgba(214, 52, 71, 0.45);
    transform: translateY(0);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .start-btn:hover {
    filter: brightness(1.08);
  }

  .start-btn:active,
  .start-btn.pressed {
    transform: translateY(9px);
    box-shadow:
      inset 0 3px 0 rgba(255, 255, 255, 0.25),
      inset 0 -3px 6px rgba(0, 0, 0, 0.35),
      0 0 0 #3a0d20,
      0 0 0 1px #000,
      0 6px 14px rgba(214, 52, 71, 0.35);
  }

  .start-btn:focus-visible {
    outline: 3px solid #b98cff;
    outline-offset: 4px;
  }

  .hint {
    color: #8a8398;
    font-size: 12px;
    text-align: center;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="scene">
  <div class="burst"></div>
  <div class="panel">
    <h1 class="title">SUPER<br>PLUMBER<br>BROS</h1>
    <div class="subtitle-tag">A Dark Descent</div>
    <canvas id="hero" width="220" height="300"></canvas>
    <button id="startBtn" class="start-btn" type="button">Start Game</button>
    <div class="hint">Move: ← → / A D &nbsp;|&nbsp; Jump: Space / ↑ / W</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('hero');
  const ctx = canvas.getContext('2d');
  const SCALE = 6.2; // blow the in-game sprite up to hero size
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Same character as in-game (mario.html drawPlayer), scaled up and
  // inked with a comic-style outline to match the chosen graphic-novel look.
  function drawCharacter(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const bob = reduceMotion ? 0 : Math.sin(t * 1.8) * 1.5;
    const ox = canvas.width / (2 * SCALE) - 14; // center a 28-wide sprite
    const oy = canvas.height / SCALE - 44 + bob;

    ctx.save();
    ctx.scale(SCALE, SCALE);
    ctx.translate(ox, oy);
    ctx.lineJoin = 'round';

    const ink = (fillStyle) => {
      ctx.fillStyle = fillStyle;
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 0.9;
      ctx.stroke();
    };

    // Legs: dark stockings + boots
    ctx.beginPath();
    ctx.rect(4, 26, 20, 14);
    ink('#1c1620');
    ctx.beginPath();
    ctx.rect(3, 36, 10, 5);
    ink('#0c0810');
    ctx.beginPath();
    ctx.rect(15, 36, 10, 5);
    ink('#0c0810');

    // Flared skirt
    ctx.beginPath();
    ctx.moveTo(6, 14);
    ctx.lineTo(22, 14);
    ctx.lineTo(26, 30);
    ctx.lineTo(2, 30);
    ctx.closePath();
    ink('#5c1030');

    // Blouse
    ctx.beginPath();
    ctx.rect(4, 12, 20, 6);
    ink('#e7e1ea');

    // Long dark hair falling behind the head/shoulders
    ctx.beginPath();
    ctx.moveTo(3, -2);
    ctx.quadraticCurveTo(-3, 20, 2, 34);
    ctx.lineTo(8, 32);
    ctx.quadraticCurveTo(4, 14, 8, -1);
    ctx.closePath();
    ink('#140d18');
    ctx.beginPath();
    ctx.moveTo(21, -2);
    ctx.quadraticCurveTo(27, 20, 22, 34);
    ctx.lineTo(16, 32);
    ctx.quadraticCurveTo(20, 14, 16, -1);
    ctx.closePath();
    ink('#140d18');

    // Head
    ctx.beginPath();
    ctx.rect(6, 0, 16, 14);
    ink('#f0c9a0');

    // Hair top + bangs
    ctx.beginPath();
    ctx.rect(4, -4, 20, 7);
    ink('#140d18');
    ctx.beginPath();
    ctx.rect(6, 0, 5, 5);
    ink('#140d18');
    ctx.beginPath();
    ctx.rect(17, 0, 5, 5);
    ink('#140d18');

    // Small bow
    ctx.beginPath();
    ctx.arc(24, -2, 3.2, 0, Math.PI * 2);
    ctx.arc(24, 4, 3.2, 0, Math.PI * 2);
    ink('#8f2d56');
    ctx.beginPath();
    ctx.rect(22.5, -0.5, 3, 3);
    ink('#5c1030');

    // Eye, with a comic-red glow
    const glowPulse = reduceMotion ? 4 : 4 + Math.sin(t * 3) * 1.5;
    ctx.shadowColor = '#d63447';
    ctx.shadowBlur = glowPulse;
    ctx.beginPath();
    ctx.rect(16, 4, 3, 4);
    ctx.fillStyle = '#2a1030';
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  if (reduceMotion) {
    drawCharacter(0);
  } else {
    function frame(ts) {
      drawCharacter(ts / 1000);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // Start Game -> hand off to the actual game
  const startBtn = document.getElementById('startBtn');
  startBtn.addEventListener('click', () => {
    startBtn.classList.add('pressed');
    setTimeout(() => { window.location.href = 'mario.html'; }, 140);
  });
})();
</script>
</body>
</html>
