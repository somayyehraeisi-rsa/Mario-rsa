<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miss Mario in Hotel Transylvania</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #050308;
  }

  .scene {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Frame keeps a fixed 1376x768 aspect ratio so every layer inside
     (art, title, hotspot) stays lined up at any viewport size. */
  .frame {
    position: relative;
    width: 100%;
    max-width: 1376px;
    aspect-ratio: 1376 / 768;
    overflow: hidden;
  }

  .frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ---- Title lockup ---- */
  .title-block {
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
    pointer-events: none;
    font-family: 'Trebuchet MS', 'Arial Black', sans-serif;
    font-weight: 900;
    line-height: 0.95;
  }

  .title-miss {
    font-size: clamp(20px, 3.4vw, 46px);
    letter-spacing: 0.12em;
    color: #f6e8ff;
    -webkit-text-stroke: 1.5px #3a1055;
    text-shadow:
      0 0 10px rgba(246, 130, 200, 0.9),
      0 3px 0 #3a1055;
  }

  .title-in {
    font-size: clamp(10px, 1.2vw, 16px);
    letter-spacing: 0.5em;
    color: #3a1055;
    margin: 0.3em 0;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
  }

  .title-main {
    font-size: clamp(34px, 6.4vw, 88px);
    letter-spacing: 0.03em;
    background: linear-gradient(180deg, #ff7fb0 0%, #d6345f 45%, #8f1638 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 2px #2a0a1c;
    text-shadow:
      0 0 22px rgba(214, 52, 95, 0.85),
      0 0 46px rgba(214, 52, 95, 0.5);
  }

  .press-start {
    position: absolute;
    left: 50%;
    top: 68%;
    transform: translate(-50%, -50%);
    background: rgba(20, 8, 28, 0.55);
    border: 2px solid #ff6fa8;
    border-radius: 8px;
    padding: 10px 28px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: clamp(14px, 2vw, 22px);
    letter-spacing: 0.25em;
    color: #ffe6f2;
    box-shadow: 0 0 16px rgba(255, 111, 168, 0.55), inset 0 0 10px rgba(255, 111, 168, 0.15);
    text-shadow: 0 0 10px #ff4d8f, 0 0 22px #ff4d8f;
  }

  .press-start:hover {
    color: #fff;
    border-color: #ff9fc4;
    background: rgba(35, 12, 46, 0.7);
    box-shadow: 0 0 22px rgba(255, 127, 176, 0.75), inset 0 0 14px rgba(255, 127, 176, 0.25);
  }

  .press-start:focus-visible {
    outline: 2px solid #b98cff;
    outline-offset: 6px;
  }

  .press-start-text {
    animation: blink 1.3s steps(1) infinite;
  }

  @keyframes blink {
    0%, 55% { opacity: 1; }
    56%, 100% { opacity: 0.25; }
  }

  .hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 2%;
    text-align: center;
    color: #8a7fa0;
    font-family: 'Courier New', monospace;
    font-size: clamp(10px, 1.4vw, 13px);
    letter-spacing: 0.02em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .leaderboard {
    position: absolute;
    top: 4%;
    left: 4%;
    min-width: 140px;
    padding: 10px 14px;
    background: rgba(15, 6, 20, 0.55);
    border: 1px solid rgba(255, 111, 168, 0.35);
    border-radius: 8px;
    color: #e6d9ee;
    font-family: 'Courier New', monospace;
    font-size: clamp(10px, 1.3vw, 13px);
  }

  .leaderboard-title {
    color: #ff6fa8;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .leaderboard ol {
    list-style: decimal inside;
    margin: 0;
    padding: 0;
  }

  .leaderboard li {
    margin: 2px 0;
  }
</style>
</head>
<body>

<div class="scene">
  <div class="frame">
    <img src="assets/title-bg.jpg" alt="" aria-hidden="true">

    <div class="title-block">
      <div class="title-miss">MISS MARIO</div>
      <div class="title-in">IN</div>
      <div class="title-main">HOTEL<br>TRANSYLVANIA</div>
    </div>

    <button class="press-start" type="button" aria-label="Press Start"><span class="press-start-text">PRESS START</span></button>

    <div class="hint">Move: &larr; &rarr; / A D &nbsp;|&nbsp; Jump: Space / &uarr; / W</div>
    <div class="leaderboard">
      <div class="leaderboard-title">TOP SCORES</div>
      <ol id="leaderboard-list"><li>Loading…</li></ol>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://vafnwxeawucjqksbrdrh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_agW1cSxW80mfjQFUnRGnoQ_S7sAs2Wv';

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  async function loadLeaderboard() {
    const listEl = document.getElementById('leaderboard-list');
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/scores?select=name,score&order=score.desc&limit=5`,
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY } }
      );
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      const rows = await res.json();
      listEl.innerHTML = rows.length
        ? rows.map(r => `<li>${escapeHtml(r.name)} — ${r.score}</li>`).join('')
        : '<li>No scores yet</li>';
    } catch (err) {
      console.error('Could not load leaderboard:', err);
      listEl.innerHTML = '<li>Unavailable</li>';
    }
  }

  loadLeaderboard();

  document.querySelector('.press-start').addEventListener('click', () => {
    window.location.href = 'mario.html';
  });
</script>
</body>
</html>
