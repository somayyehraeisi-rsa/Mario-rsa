<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Miss Mario in Hotel Transylvania</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    background: #05050f;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }

  #gameWrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #title {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ff6fa8;
    text-shadow: 0 0 8px #d6345f, 0 0 18px #d6345f, 3px 3px 0 #000;
    letter-spacing: 2px;
    font-size: clamp(13px, 1.6vw, 20px);
    opacity: 0.85;
    pointer-events: none;
    z-index: 2;
  }

  canvas {
    display: block;
    background: #05050f;
  }

  #hint {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    color: #aaa;
    font-size: clamp(9px, 1.2vw, 12px);
    opacity: 0.8;
    pointer-events: none;
    z-index: 2;
  }
</style>
</head>
<body>

<div id="gameWrap">
  <div id="title">MISS MARIO IN HOTEL TRANSYLVANIA</div>
  <canvas id="game" width="800" height="480"></canvas>
  <div id="hint">Move: ← → / A D &nbsp;|&nbsp; Jump: Space / ↑ / W &nbsp;|&nbsp; Stomp Goombas from above!</div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Setup
  // ---------------------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  // Logical/world coordinate system used by every gameplay and drawing
  // calculation below — independent of the canvas's actual pixel size.
  const VIEW_W = 800;
  const VIEW_H = 480;

  // Full-page, high-resolution canvas: the element fills the viewport
  // (preserving the 800x480 aspect ratio) while its backing pixel buffer
  // is scaled by devicePixelRatio (capped) for crisp, high-DPI/"4K" output.
  // A transform maps the fixed VIEW_W x VIEW_H logical space onto whatever
  // the actual buffer size ends up being, so no drawing code changes.
  function layoutCanvas() {
    const ratio = VIEW_W / VIEW_H;
    let cssW = window.innerWidth;
    let cssH = cssW / ratio;
    if (cssH > window.innerHeight) {
      cssH = window.innerHeight;
      cssW = cssH * ratio;
    }
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(canvas.width / VIEW_W, 0, 0, canvas.height / VIEW_H, 0, 0);
  }
  window.addEventListener('resize', layoutCanvas);
  layoutCanvas();

  // ---------------------------------------------------------------------
  // Supabase leaderboard (public anon key — safe to expose client-side,
  // access is restricted server-side by Row Level Security policies)
  // ---------------------------------------------------------------------
  const SUPABASE_URL = 'https://vafnwxeawucjqksbrdrh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_agW1cSxW80mfjQFUnRGnoQ_S7sAs2Wv';

  async function submitScore(name, score) {
    try {
      await fetch(SUPABASE_URL + '/rest/v1/scores', {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal',
        },
        body: JSON.stringify({ name, score }),
      });
    } catch (err) {
      console.error('Could not submit score to Supabase:', err);
    }
  }

  async function fetchLeaderboard(limit) {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/scores?select=name,score&order=score.desc&limit=${limit}`,
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY } }
      );
      if (!res.ok) return [];
      return await res.json();
    } catch (err) {
      console.error('Could not fetch leaderboard from Supabase:', err);
      return [];
    }
  }

  async function finishGame() {
    let name = localStorage.getItem('marioPlayerName');
    if (!name) {
      name = (prompt('Enter your name for the leaderboard:', 'Player') || 'Anonymous').trim().slice(0, 20) || 'Anonymous';
      localStorage.setItem('marioPlayerName', name);
    }
    await submitScore(name, state.score);
    state.leaderboard = await fetchLeaderboard(5);
  }

  // ---------------------------------------------------------------------
  // Tunable physics / gameplay constants
  // ---------------------------------------------------------------------
  const GRAVITY = 2100;          // px/s^2
  const MOVE_ACCEL = 2600;       // px/s^2 while a direction key is held
  const AIR_ACCEL = 1600;        // slightly less control while airborne
  const MAX_SPEED = 260;         // px/s horizontal cap
  const FRICTION = 2200;         // px/s^2 deceleration with no input, on ground
  const JUMP_VELOCITY = -700;    // initial upward velocity
  const MAX_FALL_SPEED = 900;
  const ENEMY_SPEED = 80;
  const INVULN_TIME = 1.5;       // seconds of flashing invulnerability after a hit

  const LEVEL_WIDTH = 3400;
  const GROUND_Y = 440;          // top surface of ground tiles
  const KILL_Y = 620;            // fall past this = death (pit)

  // ---------------------------------------------------------------------
  // Input handling
  // ---------------------------------------------------------------------
  const keys = {};
  const bind = { left: ['ArrowLeft', 'a', 'A'], right: ['ArrowRight', 'd', 'D'], jump: ['ArrowUp', 'w', 'W', ' '] };

  // Jump is edge-triggered (one event per key press, not per held frame) so
  // a second press while still airborne can be told apart from just holding
  // the key down — that second press fuels the higher double-jump boost.
  let jumpKeyDown = false;
  let jumpEdge = false;

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (bind.jump.includes(e.key)) {
      e.preventDefault();
      if (!jumpKeyDown) jumpEdge = true;
      jumpKeyDown = true;
    }
    if (state.mode !== 'playing' && (e.key === 'Enter' || e.key === ' ')) resetGame();
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
    if (bind.jump.includes(e.key)) jumpKeyDown = false;
  });

  function isDown(action) { return bind[action].some(k => keys[k]); }

  // ---------------------------------------------------------------------
  // Level geometry: solid platforms/ground as AABB rectangles
  // ---------------------------------------------------------------------
  function rect(x, y, w, h) { return { x, y, w, h }; }

  const solids = [
    // Ground segments, broken up by two pits for a bit of risk/reward
    rect(0, GROUND_Y, 900, 40),
    rect(980, GROUND_Y, 820, 40),
    rect(1860, GROUND_Y, 900, 40),
    rect(2820, GROUND_Y, LEVEL_WIDTH - 2820, 40),

    // Floating platforms
    rect(300, 330, 120, 24),
    rect(520, 260, 100, 24),
    rect(760, 340, 140, 24),
    rect(1120, 350, 110, 24),
    rect(1300, 260, 90, 24),
    rect(1550, 320, 130, 24),
    rect(2000, 340, 120, 24),
    rect(2200, 260, 100, 24),
    rect(2420, 350, 140, 24),
    rect(2680, 300, 100, 24),
    rect(2980, 340, 140, 24),
    rect(3150, 250, 120, 24),
  ];

  const coins = [
    { x: 340, y: 290, taken: false },
    { x: 560, y: 220, taken: false },
    { x: 800, y: 300, taken: false },
    { x: 840, y: 300, taken: false },
    { x: 1150, y: 310, taken: false },
    { x: 1330, y: 220, taken: false },
    { x: 1590, y: 280, taken: false },
    { x: 1630, y: 280, taken: false },
    { x: 2030, y: 300, taken: false },
    { x: 2230, y: 220, taken: false },
    { x: 2450, y: 310, taken: false },
    { x: 2710, y: 260, taken: false },
    { x: 3010, y: 300, taken: false },
    { x: 3180, y: 210, taken: false },
  ];

  const mushrooms = [
    { x: 500, y: GROUND_Y - 24, taken: false },
    { x: 1600, y: 290, taken: false },
    { x: 2450, y: GROUND_Y - 24 - 300 + 300, taken: false }, // sits on ground segment
    { x: 3000, y: 310, taken: false },
  ];
  // fix mushroom that should sit on ground segment 3 (x 1860-2760)
  mushrooms[2] = { x: 2500, y: GROUND_Y - 24, taken: false };

  function makeEnemy(x, y, patrolMin, patrolMax, kind) {
    return {
      x, y, w: 30, h: 28,
      vx: -ENEMY_SPEED, vy: 0,
      alive: true,
      patrolMin, patrolMax,
      squashT: 0, // squash-death animation timer
      kind: kind || 'mushroom', // 'mushroom' | 'bat' | 'ghost'
      baseY: y,
      floatPhase: Math.random() * Math.PI * 2,
    };
  }

  const enemiesInit = () => ([
    makeEnemy(500, GROUND_Y - 28, 350, 850, 'mushroom'),
    makeEnemy(1150, 350 - 60, 1130, 1220, 'bat'), // flies above a platform
    makeEnemy(2000, GROUND_Y - 28, 1900, 2700, 'ghost'),
    makeEnemy(2900, GROUND_Y - 28, 2860, 3300, 'mushroom'),
  ]);

  const FLAG_X = LEVEL_WIDTH - 80;

  // ---------------------------------------------------------------------
  // Night sky decoration (fixed field, twinkles over time)
  // ---------------------------------------------------------------------
  const STARS = Array.from({ length: 90 }, (_, i) => ({
    x: (i * 137) % (LEVEL_WIDTH + VIEW_W),
    y: (i * 53) % (GROUND_Y - 60) + 10,
    r: 1 + (i % 3) * 0.6,
    phase: i * 0.6,
  }));

  // ---------------------------------------------------------------------
  // Player
  // ---------------------------------------------------------------------
  function makePlayer() {
    return {
      x: 60, y: GROUND_Y - 40,
      w: 28, h: 40,
      vx: 0, vy: 0,
      onGround: false,
      facing: 1,
      invuln: 0,
      jumpsUsed: 0,
    };
  }

  // ---------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------
  const state = {
    mode: 'playing', // 'playing' | 'gameover' | 'victory'
    score: 0,
    lives: 3,
    cameraX: 0,
    scoreSubmitted: false,
    leaderboard: [],
  };

  let player = makePlayer();
  let enemies = enemiesInit();

  function resetGame() {
    player = makePlayer();
    enemies = enemiesInit();
    coins.forEach(c => c.taken = false);
    mushrooms.forEach(m => m.taken = false);
    state.mode = 'playing';
    state.score = 0;
    state.lives = 3;
    state.cameraX = 0;
    state.scoreSubmitted = false;
    state.leaderboard = [];
  }

  function respawnAfterDeath() {
    state.lives--;
    if (state.lives <= 0) {
      state.mode = 'gameover';
      return;
    }
    player = makePlayer();
  }

  // ---------------------------------------------------------------------
  // AABB collision helpers
  // ---------------------------------------------------------------------
  function aabbOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Resolve an entity's movement against solids, axis-separated to keep
  // things simple and avoid tunneling corner cases.
  function moveAndCollide(ent, dx, dy) {
    // Horizontal pass
    ent.x += dx;
    for (const s of solids) {
      if (!aabbOverlap(ent, s)) continue;
      if (dx > 0) ent.x = s.x - ent.w;
      else if (dx < 0) ent.x = s.x + s.w;
    }

    // Vertical pass
    ent.y += dy;
    ent.onGroundThisFrame = false;
    for (const s of solids) {
      if (!aabbOverlap(ent, s)) continue;
      if (dy > 0) { ent.y = s.y - ent.h; ent.onGroundThisFrame = true; ent.vy = 0; }
      else if (dy < 0) { ent.y = s.y + s.h; ent.vy = 0; }
    }
  }

  // ---------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------
  function updatePlayer(dt) {
    const p = player;

    // --- Horizontal input / inertia ---
    const accel = p.onGround ? MOVE_ACCEL : AIR_ACCEL;
    if (isDown('left')) { p.vx -= accel * dt; p.facing = -1; }
    else if (isDown('right')) { p.vx += accel * dt; p.facing = 1; }
    else if (p.onGround) {
      // Friction brings the player to a stop when no key is held
      if (p.vx > 0) p.vx = Math.max(0, p.vx - FRICTION * dt);
      else if (p.vx < 0) p.vx = Math.min(0, p.vx + FRICTION * dt);
    }
    p.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, p.vx));

    // --- Jump: first press leaves the ground, a second press while still
    // airborne is a double-jump that boosts higher than a single jump ---
    if (jumpEdge) {
      jumpEdge = false;
      if (p.onGround) {
        p.vy = JUMP_VELOCITY;
        p.onGround = false;
        p.jumpsUsed = 1;
      } else if (p.jumpsUsed === 1) {
        p.vy = JUMP_VELOCITY * 1.2;
        p.jumpsUsed = 2;
      }
    }

    // --- Gravity ---
    p.vy += GRAVITY * dt;
    p.vy = Math.min(MAX_FALL_SPEED, p.vy);

    moveAndCollide(p, p.vx * dt, p.vy * dt);
    p.onGround = p.onGroundThisFrame;
    if (p.onGround) p.jumpsUsed = 0;

    // Level bounds
    if (p.x < 0) p.x = 0;
    if (p.x + p.w > LEVEL_WIDTH) p.x = LEVEL_WIDTH - p.w;

    // Pit death
    if (p.y > KILL_Y) {
      respawnAfterDeath();
      return;
    }

    if (p.invuln > 0) p.invuln -= dt;

    // --- Coins ---
    for (const c of coins) {
      if (c.taken) continue;
      const cBox = { x: c.x - 10, y: c.y - 10, w: 20, h: 20 };
      if (aabbOverlap(p, cBox)) { c.taken = true; state.score += 100; }
    }

    // --- Mushrooms ---
    for (const m of mushrooms) {
      if (m.taken) continue;
      const mBox = { x: m.x - 12, y: m.y - 12, w: 24, h: 24 };
      if (aabbOverlap(p, mBox)) { m.taken = true; state.score += 500; }
    }

    // --- Enemies ---
    for (const en of enemies) {
      if (!en.alive) continue;
      if (!aabbOverlap(p, en)) continue;

      const playerBottom = p.y + p.h;
      const stomping = p.vy > 0 && playerBottom - en.y < en.h * 0.6;

      if (stomping) {
        en.alive = false;
        en.squashT = 0.25;
        p.vy = JUMP_VELOCITY * 0.55; // small bounce after stomping
        state.score += 200;
      } else if (p.invuln <= 0) {
        p.invuln = INVULN_TIME;
        // knockback away from the enemy
        p.vx = (p.x < en.x ? -1 : 1) * 220;
        p.vy = -300;
        respawnAfterDeath();
        return;
      }
    }

    // --- Flag / victory ---
    if (p.x + p.w >= FLAG_X) {
      state.mode = 'victory';
    }
  }

  function updateEnemies(dt) {
    for (const en of enemies) {
      if (!en.alive) {
        en.squashT -= dt;
        continue;
      }

      if (en.kind === 'bat' || en.kind === 'ghost') {
        // Flying enemies ignore gravity/solids and bob up and down as they patrol.
        en.floatPhase += dt * (en.kind === 'bat' ? 5 : 1.8);
        en.x += en.vx * dt;
        en.y = en.baseY + Math.sin(en.floatPhase) * (en.kind === 'bat' ? 22 : 10);
      } else {
        en.vy += GRAVITY * dt;
        en.vy = Math.min(MAX_FALL_SPEED, en.vy);
        moveAndCollide(en, en.vx * dt, en.vy * dt);
      }

      // Reverse at patrol bounds or when blocked by a wall
      if (en.x <= en.patrolMin) { en.x = en.patrolMin; en.vx = Math.abs(en.vx) || ENEMY_SPEED; }
      if (en.x + en.w >= en.patrolMax) { en.x = en.patrolMax - en.w; en.vx = -(Math.abs(en.vx) || ENEMY_SPEED); }
    }
    // Drop fully-squashed enemies out of the array for tidiness
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (!enemies[i].alive && enemies[i].squashT <= -1) enemies.splice(i, 1);
    }
  }

  function updateCamera() {
    let target = player.x + player.w / 2 - VIEW_W / 2;
    target = Math.max(0, Math.min(LEVEL_WIDTH - VIEW_W, target));
    // Smooth follow
    state.cameraX += (target - state.cameraX) * 0.15;
  }

  function update(dt) {
    if (state.mode !== 'playing') return;
    updatePlayer(dt);
    if (state.mode !== 'playing') {
      if (!state.scoreSubmitted) {
        state.scoreSubmitted = true;
        finishGame();
      }
      return;
    }
    updateEnemies(dt);
    updateCamera();
  }

  // ---------------------------------------------------------------------
  // Drawing
  // ---------------------------------------------------------------------
  function drawBackground(t) {
    // Castle-hall gradient: deep indigo stone fading to a violet haze low down
    const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    sky.addColorStop(0, '#140c24');
    sky.addColorStop(0.5, '#241536');
    sky.addColorStop(1, '#3d2350');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // Faint dust motes drifting in the hall (stand-in for stars)
    const starParallax = state.cameraX * 0.15;
    ctx.fillStyle = '#fff';
    for (const star of STARS) {
      const sx = star.x - starParallax;
      const wrapped = ((sx % (LEVEL_WIDTH + VIEW_W)) + (LEVEL_WIDTH + VIEW_W)) % (LEVEL_WIDTH + VIEW_W);
      if (wrapped > VIEW_W) continue;
      const twinkle = 0.15 + Math.abs(Math.sin(t * 1.6 + star.phase)) * 0.35;
      ctx.globalAlpha = twinkle;
      ctx.beginPath();
      ctx.arc(wrapped, star.y, star.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Hazy far-distance mountain range — the slowest-moving layer, giving
    // the scene an extra plane of depth behind the windows/hotel.
    const farParallax = state.cameraX * 0.08;
    ctx.fillStyle = 'rgba(60, 40, 90, 0.35)';
    for (let i = -1; i < 6; i++) {
      const mx = i * 360 - (farParallax % 360);
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y - 60);
      ctx.lineTo(mx + 90, GROUND_Y - 190);
      ctx.lineTo(mx + 190, GROUND_Y - 100);
      ctx.lineTo(mx + 280, GROUND_Y - 220);
      ctx.lineTo(mx + 380, GROUND_Y - 60);
      ctx.closePath();
      ctx.fill();
    }

    // Repeating tall gothic windows with the moon showing through the glass,
    // a gargoyle perched on each stone ledge.
    const winParallax = state.cameraX * 0.35;
    const winSpacing = 420;
    for (let i = -1; i < Math.ceil(VIEW_W / winSpacing) + 2; i++) {
      const wx = i * winSpacing - (winParallax % winSpacing);
      drawGothicWindow(wx, 40, t);
    }

    // The hotel from the movie poster, looming behind the finish flag
    drawEndHotel(t);

    // Distant brick wall texture band above the platforms
    const parallax = state.cameraX * 0.3;
    ctx.fillStyle = '#1e1430';
    ctx.fillRect(0, GROUND_Y - 70, VIEW_W, 70);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    for (let bx = -((parallax) % 40); bx < VIEW_W; bx += 40) {
      ctx.beginPath();
      ctx.moveTo(bx, GROUND_Y - 70);
      ctx.lineTo(bx, GROUND_Y);
      ctx.stroke();
    }

    // Drifting purple ground fog
    const parallax2 = state.cameraX * 0.5;
    ctx.fillStyle = 'rgba(190, 120, 220, 0.10)';
    for (let i = -1; i < 8; i++) {
      const fx = i * 300 - (parallax2 % 300) + Math.sin(t * 0.3 + i) * 12;
      const fy = GROUND_Y - 30 - (i % 3) * 18;
      drawFogPatch(fx, fy);
    }
  }

  function drawGothicWindow(x, y, t) {
    const w = 130, h = 230;
    // stone frame
    ctx.fillStyle = '#241a32';
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + 40);
    ctx.quadraticCurveTo(x, y, x + w / 2, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + 40);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();

    // glass pane (inset)
    const inset = 10;
    const gx = x + inset, gy = y + 34, gw = w - inset * 2, gh = h - 34 - inset;
    const glass = ctx.createLinearGradient(0, gy, 0, gy + gh);
    glass.addColorStop(0, '#241238');
    glass.addColorStop(1, '#3a1c46');
    ctx.fillStyle = glass;
    ctx.beginPath();
    ctx.moveTo(gx, gy + gh);
    ctx.lineTo(gx, gy + 24);
    ctx.quadraticCurveTo(gx, gy - 10, gx + gw / 2, gy - 10);
    ctx.quadraticCurveTo(gx + gw, gy - 10, gx + gw, gy + 24);
    ctx.lineTo(gx + gw, gy + gh);
    ctx.closePath();
    ctx.fill();

    // moon glimpsed through the glass
    ctx.save();
    ctx.clip();
    ctx.fillStyle = 'rgba(226, 220, 190, 0.85)';
    ctx.beginPath();
    ctx.arc(gx + gw / 2, gy + 46, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // mullions
    ctx.strokeStyle = 'rgba(20, 12, 30, 0.8)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y + 4);
    ctx.lineTo(x + w / 2, y + h);
    ctx.moveTo(gx, gy + gh * 0.6);
    ctx.lineTo(gx + gw, gy + gh * 0.6);
    ctx.stroke();

    // gargoyle silhouette perched on the ledge
    drawGargoyle(x + w / 2, y + h - 6, t);
  }

  function drawGargoyle(cx, groundY, t) {
    const bob = Math.sin(t * 0.6 + cx) * 1.5;
    const y = groundY + bob;
    ctx.fillStyle = '#352745';
    // wings
    ctx.beginPath();
    ctx.moveTo(cx - 4, y - 18);
    ctx.lineTo(cx - 26, y - 6);
    ctx.lineTo(cx - 6, y - 4);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 4, y - 18);
    ctx.lineTo(cx + 26, y - 6);
    ctx.lineTo(cx + 6, y - 4);
    ctx.closePath();
    ctx.fill();
    // crouched body
    ctx.beginPath();
    ctx.ellipse(cx, y - 6, 11, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    // ears/horns
    ctx.beginPath();
    ctx.moveTo(cx - 6, y - 18);
    ctx.lineTo(cx - 8, y - 26);
    ctx.lineTo(cx - 3, y - 18);
    ctx.moveTo(cx + 6, y - 18);
    ctx.lineTo(cx + 8, y - 26);
    ctx.lineTo(cx + 3, y - 18);
    ctx.closePath();
    ctx.fill();
    // eyes
    ctx.fillStyle = '#ff2a2a';
    ctx.beginPath();
    ctx.arc(cx - 3, y - 12, 1.4, 0, Math.PI * 2);
    ctx.arc(cx + 3, y - 12, 1.4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawEndHotel(t) {
    const worldX = FLAG_X - 460;
    const hx = worldX - state.cameraX;
    if (hx > VIEW_W + 20 || hx + 600 < -20) return;

    // Base wing
    ctx.fillStyle = '#160a22';
    ctx.fillRect(hx + 40, 160, 520, GROUND_Y - 160);

    // Left turret with a conical cap
    ctx.fillStyle = '#1c0e28';
    ctx.fillRect(hx + 55, 90, 95, GROUND_Y - 90);
    ctx.beginPath();
    ctx.moveTo(hx + 45, 90);
    ctx.lineTo(hx + 102, 48);
    ctx.lineTo(hx + 160, 90);
    ctx.closePath();
    ctx.fill();

    // Right turret with a conical cap
    ctx.fillStyle = '#1c0e28';
    ctx.fillRect(hx + 450, 110, 95, GROUND_Y - 110);
    ctx.beginPath();
    ctx.moveTo(hx + 440, 110);
    ctx.lineTo(hx + 497, 66);
    ctx.lineTo(hx + 555, 110);
    ctx.closePath();
    ctx.fill();

    // Tall central tower with a steep spire
    ctx.fillStyle = '#241436';
    ctx.fillRect(hx + 220, 40, 160, GROUND_Y - 40);
    ctx.beginPath();
    ctx.moveTo(hx + 205, 40);
    ctx.lineTo(hx + 300, -20);
    ctx.lineTo(hx + 395, 40);
    ctx.closePath();
    ctx.fill();
    // little finial ball on the spire tip
    ctx.beginPath();
    ctx.arc(hx + 300, -22, 5, 0, Math.PI * 2);
    ctx.fill();

    // Glowing crooked windows scattered across the facade (movie-poster style)
    ctx.fillStyle = 'rgba(255, 200, 110, 0.85)';
    const winRows = [
      [70, 130], [70, 200], [70, 260], [70, 320], [70, 380],
      [120, 130], [120, 200], [120, 320],
      [240, 90], [240, 150], [240, 210], [240, 270], [240, 330], [240, 390],
      [300, 90], [300, 210], [300, 330],
      [340, 90], [340, 150], [340, 270], [340, 390],
      [470, 150], [470, 210], [470, 320], [470, 380],
      [510, 150], [510, 260],
    ];
    for (let i = 0; i < winRows.length; i++) {
      const [wx0, wy0] = winRows[i];
      const flicker = 0.55 + Math.abs(Math.sin(t * 1.3 + i * 1.7)) * 0.45;
      ctx.globalAlpha = flicker;
      ctx.fillRect(hx + wx0, wy0, 10, 14);
    }
    ctx.globalAlpha = 1;

    // Glowing pink "HOTEL" sign mounted on the central tower
    ctx.shadowColor = '#ff4d8f';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff9fc4';
    ctx.font = 'bold 22px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('HOTEL', hx + 300, 125);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';

    // Arched entrance with flanking torches
    ctx.fillStyle = '#0a0512';
    ctx.beginPath();
    ctx.moveTo(hx + 265, GROUND_Y);
    ctx.lineTo(hx + 265, GROUND_Y - 50);
    ctx.quadraticCurveTo(hx + 300, GROUND_Y - 85, hx + 335, GROUND_Y - 50);
    ctx.lineTo(hx + 335, GROUND_Y);
    ctx.closePath();
    ctx.fill();

    for (const tx of [hx + 250, hx + 350]) {
      const flameGlow = ctx.createRadialGradient(tx, GROUND_Y - 55, 1, tx, GROUND_Y - 55, 16);
      flameGlow.addColorStop(0, 'rgba(255, 170, 90, 0.9)');
      flameGlow.addColorStop(1, 'rgba(255, 170, 90, 0)');
      ctx.fillStyle = flameGlow;
      ctx.beginPath();
      ctx.arc(tx, GROUND_Y - 55, 16, 0, Math.PI * 2);
      ctx.fill();
    }

    // A couple of bats circling the towers
    ctx.fillStyle = '#0c0812';
    for (let b = 0; b < 2; b++) {
      const orbit = t * 1.2 + b * Math.PI;
      const bx = hx + 300 + Math.cos(orbit) * 220;
      const by = 70 + Math.sin(orbit) * 30 + b * 20;
      ctx.save();
      ctx.translate(bx, by);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-6, -4, -12, -2, -14, 2);
      ctx.bezierCurveTo(-9, 1, -5, 2, 0, 5);
      ctx.bezierCurveTo(5, 2, 9, 1, 14, 2);
      ctx.bezierCurveTo(12, -2, 6, -4, 0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawSlimePool(t) {
    // Glowing purple ooze filling the pit gaps below the platforms.
    // Drawn before the platforms so solid ground/floor tiles paint over it
    // wherever the level actually has floor, leaving only the pits lethal.
    const poolY = KILL_Y - 30;
    const grad = ctx.createLinearGradient(0, poolY, 0, VIEW_H);
    grad.addColorStop(0, 'rgba(190, 60, 230, 0.9)');
    grad.addColorStop(1, 'rgba(90, 20, 120, 0.95)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, poolY, VIEW_W, VIEW_H - poolY);

    ctx.strokeStyle = 'rgba(230, 160, 255, 0.8)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = 0; x <= VIEW_W; x += 20) {
      const wob = Math.sin(t * 3 + x * 0.05) * 4;
      if (x === 0) ctx.moveTo(x, poolY + wob);
      else ctx.lineTo(x, poolY + wob);
    }
    ctx.stroke();

    // rising bubbles
    ctx.fillStyle = 'rgba(230, 180, 255, 0.7)';
    for (let i = 0; i < 14; i++) {
      const bx = (i * 97 + (t * 30) % 97 * 3) % VIEW_W;
      const by = poolY + 20 + ((i * 53 + t * 40) % (VIEW_H - poolY - 20));
      const r = 2 + (i % 3);
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFogPatch(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.arc(x + 26, y - 6, 26, 0, Math.PI * 2);
    ctx.arc(x + 54, y, 22, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSolids() {
    for (const s of solids) {
      const sx = s.x - state.cameraX;
      if (sx + s.w < 0 || sx > VIEW_W) continue;

      const isGround = s.y === GROUND_Y;

      // Soft cast shadow on whatever is behind/below a floating platform,
      // and an ambient-occlusion strip under ground tiles — both read as
      // depth cues that a flat fill can't give.
      if (!isGround) {
        ctx.fillStyle = 'rgba(4, 2, 8, 0.35)';
        ctx.beginPath();
        ctx.ellipse(sx + s.w / 2, s.y + s.h + 10, s.w / 2, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Front face: vertical gradient (moonlight catching the top, the
      // block falling into shadow toward the bottom) instead of a flat fill.
      const face = ctx.createLinearGradient(0, s.y, 0, s.y + s.h);
      if (isGround) {
        face.addColorStop(0, '#6b5a80');
        face.addColorStop(0.18, '#4c3a5a');
        face.addColorStop(1, '#291f38');
      } else {
        face.addColorStop(0, '#7a4f8a');
        face.addColorStop(0.18, '#5a3d68');
        face.addColorStop(1, '#301f3c');
      }
      ctx.fillStyle = face;
      ctx.fillRect(sx, s.y, s.w, s.h);

      // Lit top edge (the actual walkable surface catching the moonlight)
      ctx.fillStyle = isGround ? '#8a7aa0' : '#9a6cae';
      ctx.fillRect(sx, s.y, s.w, 4);

      // Left edge catches a little light, right edge falls into shadow —
      // reads as a subtle extrusion/bevel on the block.
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(sx, s.y + 4, 3, s.h - 4);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(sx + s.w - 4, s.y + 4, 4, s.h - 4);

      // cracked mortar texture
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1;
      for (let bx = 0; bx < s.w; bx += 20) {
        ctx.beginPath();
        ctx.moveTo(sx + bx, s.y + 8);
        ctx.lineTo(sx + bx, s.y + s.h);
        ctx.stroke();
      }
    }
  }

  // Finds the y of the nearest solid surface directly beneath world-x
  // `wx` (the highest/topmost one, i.e. smallest y). Returns null when
  // there is nothing below (an open pit) — used to fade out contact
  // shadows over the slime pool instead of drawing them on nothing.
  function findGroundY(wx) {
    let best = null;
    for (const s of solids) {
      if (wx < s.x || wx > s.x + s.w) continue;
      if (best === null || s.y < best) best = s.y;
    }
    return best;
  }

  // A soft squashed ellipse cast onto the surface below an entity — the
  // single biggest cue for "this thing is a solid object above a floor"
  // rather than a flat sprite floating on a flat background.
  function drawContactShadow(worldX, entityBottomY, halfWidth) {
    const gy = findGroundY(worldX);
    if (gy === null) return;
    const dist = Math.max(0, gy - entityBottomY);
    const scale = Math.max(0, 1 - dist / 200);
    if (scale <= 0.03) return;
    const sx = worldX - state.cameraX;
    ctx.fillStyle = `rgba(3, 1, 6, ${0.4 * scale})`;
    ctx.beginPath();
    ctx.ellipse(sx, gy - 1, halfWidth * (0.5 + scale * 0.5), 4 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawShadows() {
    for (const en of enemies) {
      if (!en.alive) continue;
      drawContactShadow(en.x + en.w / 2, en.y + en.h, en.w / 2);
    }
    drawContactShadow(player.x + player.w / 2, player.y + player.h, player.w / 2);
  }

  function drawCoins(t) {
    for (const c of coins) {
      if (c.taken) continue;
      const cx = c.x - state.cameraX;
      if (cx < -20 || cx > VIEW_W + 20) continue;
      const squish = Math.abs(Math.sin(t * 4 + c.x));
      ctx.save();
      ctx.translate(cx, c.y);
      ctx.scale(0.3 + squish * 0.7, 1);
      ctx.shadowColor = '#8a6a12';
      ctx.shadowBlur = 12;
      const coinGrad = ctx.createRadialGradient(-3, -3, 1, 0, 0, 11);
      coinGrad.addColorStop(0, '#f0c95c');
      coinGrad.addColorStop(0.5, '#b8860b');
      coinGrad.addColorStop(1, '#7a5608');
      ctx.beginPath();
      ctx.fillStyle = coinGrad;
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#5c4108';
      ctx.lineWidth = 2;
      ctx.stroke();
      // glossy highlight streak
      ctx.fillStyle = 'rgba(255, 245, 210, 0.75)';
      ctx.beginPath();
      ctx.ellipse(-3, -4, 3, 5, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawMushrooms() {
    for (const m of mushrooms) {
      if (m.taken) continue;
      const mx = m.x - state.cameraX;
      if (mx < -24 || mx > VIEW_W + 24) continue;
      // stem
      ctx.fillStyle = '#f5e9d8';
      ctx.fillRect(mx - 7, m.y, 14, 12);
      // cap: cheerful candy-pink power mushroom
      ctx.shadowColor = '#ff4fa0';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff4fa0';
      ctx.beginPath();
      ctx.arc(mx, m.y, 13, Math.PI, 0);
      ctx.fill();
      ctx.shadowBlur = 0;
      // white spots
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(mx - 6, m.y - 5, 3, 0, Math.PI * 2);
      ctx.arc(mx + 6, m.y - 5, 3, 0, Math.PI * 2);
      ctx.arc(mx, m.y - 10, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawEnemies(t) {
    for (const en of enemies) {
      const ex = en.x - state.cameraX;
      if (ex + en.w < 0 || ex > VIEW_W) continue;

      ctx.save();
      if (!en.alive) {
        // squashed death animation: flatten vertically
        ctx.translate(ex, en.y + en.h);
        ctx.scale(1, 0.2);
        ctx.translate(-ex, -(en.y + en.h));
      }

      if (en.kind === 'bat') drawBatEnemy(ex, en, t);
      else if (en.kind === 'ghost') drawGhostEnemy(ex, en, t);
      else drawMushroomEnemy(ex, en, t);

      ctx.restore();
    }
  }

  function drawMushroomEnemy(ex, en, t) {
    const cx = ex + en.w / 2, top = en.y, h = en.h, w = en.w;
    // stem/legs
    ctx.fillStyle = '#d8c9e0';
    ctx.fillRect(ex + 6, top + h - 12, w - 12, 12);
    ctx.fillStyle = '#2a1032';
    ctx.fillRect(ex + 4, top + h - 6, 8, 6);
    ctx.fillRect(ex + w - 12, top + h - 6, 8, 6);

    // angry spotted cap — domed gradient for volume
    const capGrad = ctx.createRadialGradient(cx - w * 0.15, top + h * 0.42 - w * 0.2, 1, cx, top + h * 0.42, w * 0.55);
    capGrad.addColorStop(0, '#9a5cc8');
    capGrad.addColorStop(0.6, '#6a2d8f');
    capGrad.addColorStop(1, '#3c1656');
    ctx.fillStyle = capGrad;
    ctx.beginPath();
    ctx.arc(cx, top + h * 0.42, w / 2, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#ff2a2a';
    ctx.beginPath();
    ctx.arc(cx - 8, top + 8, 3, 0, Math.PI * 2);
    ctx.arc(cx + 7, top + 6, 2.5, 0, Math.PI * 2);
    ctx.arc(cx, top + 12, 2, 0, Math.PI * 2);
    ctx.fill();

    // scowling eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx - 6, top + h * 0.5, 3.5, 0, Math.PI * 2);
    ctx.arc(cx + 6, top + h * 0.5, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0a20';
    ctx.beginPath();
    ctx.arc(cx - 6, top + h * 0.5, 1.6, 0, Math.PI * 2);
    ctx.arc(cx + 6, top + h * 0.5, 1.6, 0, Math.PI * 2);
    ctx.fill();

    // fangs
    ctx.fillStyle = '#f2ecf5';
    ctx.beginPath();
    ctx.moveTo(cx - 4, top + h * 0.62);
    ctx.lineTo(cx - 1, top + h * 0.75);
    ctx.lineTo(cx + 2, top + h * 0.62);
    ctx.closePath();
    ctx.fill();
  }

  function drawBatEnemy(ex, en, t) {
    const cx = ex + en.w / 2, cy = en.y + en.h / 2;
    const flap = Math.sin(t * 14) * 10;
    ctx.fillStyle = '#170a22';
    // wings
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(cx - 14, cy - 10 - flap, cx - 22, cy + 2);
    ctx.quadraticCurveTo(cx - 12, cy + 2, cx, cy + 6);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(cx + 14, cy - 10 - flap, cx + 22, cy + 2);
    ctx.quadraticCurveTo(cx + 12, cy + 2, cx, cy + 6);
    ctx.closePath();
    ctx.fill();
    // body — small radial highlight so it doesn't read as a flat silhouette
    const batGrad = ctx.createRadialGradient(cx - 2, cy - 2, 0.5, cx, cy, 8);
    batGrad.addColorStop(0, '#3a2650');
    batGrad.addColorStop(1, '#170a22');
    ctx.fillStyle = batGrad;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 7, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // ears
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy - 7);
    ctx.lineTo(cx - 6, cy - 13);
    ctx.lineTo(cx - 2, cy - 8);
    ctx.moveTo(cx + 5, cy - 7);
    ctx.lineTo(cx + 6, cy - 13);
    ctx.lineTo(cx + 2, cy - 8);
    ctx.closePath();
    ctx.fill();
    // glowing eyes
    ctx.shadowColor = '#ff2a2a';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#ff2a2a';
    ctx.beginPath();
    ctx.arc(cx - 2.5, cy - 1, 1.6, 0, Math.PI * 2);
    ctx.arc(cx + 2.5, cy - 1, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawGhostEnemy(ex, en, t) {
    const cx = ex + en.w / 2, top = en.y, w = en.w, h = en.h;
    // flowing hooded robe — gradient gives it a sense of folds/volume
    const robeGrad = ctx.createLinearGradient(cx - w / 2, top, cx + w / 2, top + h);
    robeGrad.addColorStop(0, '#332146');
    robeGrad.addColorStop(0.5, '#1c1428');
    robeGrad.addColorStop(1, '#0c0714');
    ctx.fillStyle = robeGrad;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, top + h);
    ctx.quadraticCurveTo(cx - w / 2 - 4, top + h * 0.4, cx, top);
    ctx.quadraticCurveTo(cx + w / 2 + 4, top + h * 0.4, cx + w / 2, top + h);
    const wob = Math.sin(t * 3 + cx) * 3;
    ctx.quadraticCurveTo(cx + w / 4, top + h - 6 + wob, cx, top + h - 2);
    ctx.quadraticCurveTo(cx - w / 4, top + h - 6 - wob, cx - w / 2, top + h);
    ctx.closePath();
    ctx.fill();

    // hood shadow / void face
    ctx.fillStyle = '#0a0612';
    ctx.beginPath();
    ctx.ellipse(cx, top + h * 0.38, w * 0.28, h * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();

    // glowing red eyes
    ctx.shadowColor = '#ff2a2a';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff2a2a';
    ctx.beginPath();
    ctx.arc(cx - 5, top + h * 0.38, 2.4, 0, Math.PI * 2);
    ctx.arc(cx + 5, top + h * 0.38, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawFlag() {
    const fx = FLAG_X - state.cameraX;
    if (fx < -20 || fx > VIEW_W + 20) return;
    ctx.fillStyle = '#3a3540';
    ctx.fillRect(fx, GROUND_Y - 220, 6, 220);
    ctx.shadowColor = '#d63447';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#8f2d56';
    ctx.beginPath();
    ctx.moveTo(fx + 6, GROUND_Y - 220);
    ctx.lineTo(fx + 46, GROUND_Y - 205);
    ctx.lineTo(fx + 6, GROUND_Y - 190);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawPlayer() {
    const p = player;
    // Flash while invulnerable
    if (p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0) return;

    const px = p.x - state.cameraX;
    ctx.save();
    ctx.translate(px + p.w / 2, 0);
    ctx.scale(p.facing, 1);
    ctx.translate(-p.w / 2, 0);

    // Legs: white stockings + red boots
    ctx.fillStyle = '#f0ecf5';
    ctx.fillRect(4, p.y + 26, 20, 14);
    ctx.fillStyle = '#c81e3a';
    ctx.fillRect(3, p.y + 35, 10, 6);
    ctx.fillRect(15, p.y + 35, 10, 6);
    ctx.fillStyle = '#8f1029';
    ctx.fillRect(3, p.y + 39, 10, 2);
    ctx.fillRect(15, p.y + 39, 10, 2);

    // Flared purple dress, drawn as a trapezoid with a light-from-upper-left
    // gradient so it reads as fabric wrapped around a body, not a flat shape.
    const dressGrad = ctx.createLinearGradient(2, p.y + 14, 26, p.y + 30);
    dressGrad.addColorStop(0, '#8a4bb0');
    dressGrad.addColorStop(0.5, '#6a2d8f');
    dressGrad.addColorStop(1, '#3e1a58');
    ctx.fillStyle = dressGrad;
    ctx.beginPath();
    ctx.moveTo(6, p.y + 14);
    ctx.lineTo(22, p.y + 14);
    ctx.lineTo(26, p.y + 30);
    ctx.lineTo(2, p.y + 30);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#4a1f66';
    ctx.fillRect(2, p.y + 27, 24, 3);

    // White blouse collar
    ctx.fillStyle = '#f0ecf5';
    ctx.fillRect(4, p.y + 12, 20, 6);

    // White glove peeking at the side
    ctx.fillStyle = '#fdfbff';
    ctx.beginPath();
    ctx.arc(1, p.y + 20, 4, 0, Math.PI * 2);
    ctx.fill();

    // Auburn hair falling behind the head/shoulders
    ctx.fillStyle = '#7a3a26';
    ctx.beginPath();
    ctx.moveTo(3, p.y - 2);
    ctx.quadraticCurveTo(-3, p.y + 20, 2, p.y + 34);
    ctx.lineTo(8, p.y + 32);
    ctx.quadraticCurveTo(4, p.y + 14, 8, p.y - 1);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(21, p.y - 2);
    ctx.quadraticCurveTo(27, p.y + 20, 22, p.y + 34);
    ctx.lineTo(16, p.y + 32);
    ctx.quadraticCurveTo(20, p.y + 14, 16, p.y - 1);
    ctx.closePath();
    ctx.fill();

    // Head
    ctx.fillStyle = '#f0c9a0';
    ctx.fillRect(6, p.y, 16, 14);

    // Auburn bangs
    ctx.fillStyle = '#7a3a26';
    ctx.fillRect(6, p.y, 5, 5);
    ctx.fillRect(17, p.y, 5, 5);

    // Purple cap with a red "M" badge — domed gradient for a rounded look
    const capGrad = ctx.createRadialGradient(10, p.y - 8, 1, 14, p.y - 4, 16);
    capGrad.addColorStop(0, '#8a4fc0');
    capGrad.addColorStop(0.55, '#5a2380');
    capGrad.addColorStop(1, '#341350');
    ctx.fillStyle = capGrad;
    ctx.beginPath();
    ctx.moveTo(3, p.y - 1);
    ctx.quadraticCurveTo(14, p.y - 12, 25, p.y - 1);
    ctx.lineTo(25, p.y + 2);
    ctx.lineTo(3, p.y + 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#3a1658';
    ctx.fillRect(20, p.y - 3, 8, 4);
    ctx.fillStyle = '#c81e3a';
    ctx.beginPath();
    ctx.arc(14, p.y - 5, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 6px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('M', 14, p.y - 3);
    ctx.textAlign = 'left';

    // Blue eye, friendly (no glow)
    ctx.fillStyle = '#2a4d8f';
    ctx.fillRect(16, p.y + 4, 3, 4);

    ctx.restore();
  }

  function drawHeart(x, y, size, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 10, size / 10);
    ctx.beginPath();
    ctx.moveTo(0, 3);
    ctx.bezierCurveTo(0, 0, -5, -2, -5, 2);
    ctx.bezierCurveTo(-5, 5, -2, 7, 0, 9);
    ctx.bezierCurveTo(2, 7, 5, 5, 5, 2);
    ctx.bezierCurveTo(5, -2, 0, 0, 0, 3);
    ctx.closePath();
    if (filled) {
      ctx.fillStyle = '#e0233f';
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(224, 35, 63, 0.6)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCoinIcon(x, y, r) {
    ctx.fillStyle = '#ffd23f';
    ctx.strokeStyle = '#a8790a';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#a8790a';
    ctx.font = `bold ${r}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('G', x, y + 1);
  }

  function drawHUD() {
    ctx.textBaseline = 'middle';

    // Hearts (top-left) — filled for remaining lives, outlined for the rest
    const MAX_LIVES = 3;
    for (let i = 0; i < MAX_LIVES; i++) {
      drawHeart(20 + i * 22, 22, 16, i < state.lives);
    }

    // Coin count, next to the hearts
    drawCoinIcon(108, 22, 10);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(state.score + ' G', 124, 23);

    // Progress, small, top-center
    const pct = Math.round(Math.min(100, (player.x / (FLAG_X)) * 100));
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(pct + '%', VIEW_W / 2, 22);

    // Portrait nameplate (top-right)
    const boxW = 150, boxH = 34, boxX = VIEW_W - boxW - 14, boxY = 8;
    ctx.fillStyle = 'rgba(15, 6, 22, 0.6)';
    ctx.strokeStyle = 'rgba(255, 111, 168, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, 6);
    else ctx.rect(boxX, boxY, boxW, boxH);
    ctx.fill();
    ctx.stroke();

    // mini portrait
    const pcx = boxX + 18, pcy = boxY + boxH / 2;
    ctx.fillStyle = '#f0c9a0';
    ctx.beginPath();
    ctx.arc(pcx, pcy + 2, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5a2380';
    ctx.beginPath();
    ctx.moveTo(pcx - 9, pcy - 2);
    ctx.quadraticCurveTo(pcx, pcy - 14, pcx + 9, pcy - 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c81e3a';
    ctx.beginPath();
    ctx.arc(pcx, pcy - 5, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff9fc4';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('MISS', boxX + 34, boxY + 12);
    ctx.fillStyle = '#fff';
    ctx.fillText('MARIO', boxX + 34, boxY + 24);

    ctx.textAlign = 'left';
  }

  function drawOverlay() {
    if (state.mode === 'playing') return;

    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    ctx.textAlign = 'center';
    ctx.fillStyle = state.mode === 'victory' ? '#ffd23f' : '#e03c31';
    ctx.font = 'bold 48px monospace';
    ctx.fillText(state.mode === 'victory' ? 'YOU WIN!' : 'GAME OVER', VIEW_W / 2, VIEW_H / 2 - 30);

    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Final Score: ' + state.score, VIEW_W / 2, VIEW_H / 2 + 15);
    ctx.fillText('Press ENTER or SPACE to restart', VIEW_W / 2, VIEW_H / 2 + 50);

    if (state.leaderboard.length) {
      ctx.font = 'bold 16px monospace';
      ctx.fillText('TOP SCORES', VIEW_W / 2, VIEW_H / 2 + 85);
      ctx.font = '15px monospace';
      state.leaderboard.forEach((entry, i) => {
        ctx.fillText(`${i + 1}. ${entry.name} — ${entry.score}`, VIEW_W / 2, VIEW_H / 2 + 108 + i * 20);
      });
    }

    ctx.textAlign = 'left';
  }

  function drawVignette(t) {
    const flicker = 0.4 + Math.sin(t * 2.3) * 0.04 + Math.random() * 0.02;
    const grad = ctx.createRadialGradient(
      VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.34,
      VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.9
    );
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${flicker})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  function draw(t) {
    drawBackground(t);
    drawSlimePool(t);
    drawSolids();
    drawShadows();
    drawMushrooms();
    drawCoins(t);
    drawFlag();
    drawEnemies(t);
    drawPlayer();
    drawVignette(t);
    drawHUD();
    drawOverlay();
  }

  // ---------------------------------------------------------------------
  // Main loop (fixed-step physics driven by real delta time, clamped to
  // avoid huge jumps if the tab was backgrounded)
  // ---------------------------------------------------------------------
  let lastTime = null;

  function frame(timestamp) {
    if (lastTime === null) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    dt = Math.min(dt, 1 / 30); // clamp so tab-switching doesn't cause tunneling
    lastTime = timestamp;

    update(dt);
    draw(timestamp / 1000);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
