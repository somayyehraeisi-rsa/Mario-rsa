<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Plumber Bros - Retro Platformer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }

  #gameWrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #title {
    color: #8f2d56;
    text-shadow: 0 0 8px #d63447, 0 0 18px #d63447, 3px 3px 0 #000;
    letter-spacing: 2px;
    font-size: 22px;
  }

  canvas {
    background: #05050f;
    border: 6px solid #111;
    border-radius: 6px;
    box-shadow: 0 0 0 4px #3a1f4d, 0 10px 40px rgba(0,0,0,0.85);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 95vw;
    height: auto;
  }

  #hint {
    color: #aaa;
    font-size: 12px;
  }
</style>
</head>
<body>

<div id="gameWrap">
  <div id="title">SUPER PLUMBER BROS</div>
  <canvas id="game" width="800" height="480"></canvas>
  <div id="hint">Move: ← → / A D &nbsp;|&nbsp; Jump: Space / ↑ / W &nbsp;|&nbsp; Stomp Goombas from above!</div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Setup
  // ---------------------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const VIEW_W = canvas.width;
  const VIEW_H = canvas.height;

  // ---------------------------------------------------------------------
  // Tunable physics / gameplay constants
  // ---------------------------------------------------------------------
  const GRAVITY = 2100;          // px/s^2
  const MOVE_ACCEL = 2600;       // px/s^2 while a direction key is held
  const AIR_ACCEL = 1600;        // slightly less control while airborne
  const MAX_SPEED = 260;         // px/s horizontal cap
  const FRICTION = 2200;         // px/s^2 deceleration with no input, on ground
  const JUMP_VELOCITY = -700;    // initial upward velocity
  const MAX_FALL_SPEED = 900;
  const ENEMY_SPEED = 80;
  const INVULN_TIME = 1.5;       // seconds of flashing invulnerability after a hit

  const LEVEL_WIDTH = 3400;
  const GROUND_Y = 440;          // top surface of ground tiles
  const KILL_Y = 620;            // fall past this = death (pit)

  // ---------------------------------------------------------------------
  // Input handling
  // ---------------------------------------------------------------------
  const keys = {};
  const bind = { left: ['ArrowLeft', 'a', 'A'], right: ['ArrowRight', 'd', 'D'], jump: ['ArrowUp', 'w', 'W', ' '] };

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (bind.jump.includes(e.key)) e.preventDefault();
    if (state.mode !== 'playing' && (e.key === 'Enter' || e.key === ' ')) resetGame();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function isDown(action) { return bind[action].some(k => keys[k]); }

  // ---------------------------------------------------------------------
  // Level geometry: solid platforms/ground as AABB rectangles
  // ---------------------------------------------------------------------
  function rect(x, y, w, h) { return { x, y, w, h }; }

  const solids = [
    // Ground segments, broken up by two pits for a bit of risk/reward
    rect(0, GROUND_Y, 900, 40),
    rect(980, GROUND_Y, 820, 40),
    rect(1860, GROUND_Y, 900, 40),
    rect(2820, GROUND_Y, LEVEL_WIDTH - 2820, 40),

    // Floating platforms
    rect(300, 330, 120, 24),
    rect(520, 260, 100, 24),
    rect(760, 340, 140, 24),
    rect(1120, 350, 110, 24),
    rect(1300, 260, 90, 24),
    rect(1550, 320, 130, 24),
    rect(2000, 340, 120, 24),
    rect(2200, 260, 100, 24),
    rect(2420, 350, 140, 24),
    rect(2680, 300, 100, 24),
    rect(2980, 340, 140, 24),
    rect(3150, 250, 120, 24),
  ];

  const coins = [
    { x: 340, y: 290, taken: false },
    { x: 560, y: 220, taken: false },
    { x: 800, y: 300, taken: false },
    { x: 840, y: 300, taken: false },
    { x: 1150, y: 310, taken: false },
    { x: 1330, y: 220, taken: false },
    { x: 1590, y: 280, taken: false },
    { x: 1630, y: 280, taken: false },
    { x: 2030, y: 300, taken: false },
    { x: 2230, y: 220, taken: false },
    { x: 2450, y: 310, taken: false },
    { x: 2710, y: 260, taken: false },
    { x: 3010, y: 300, taken: false },
    { x: 3180, y: 210, taken: false },
  ];

  const mushrooms = [
    { x: 500, y: GROUND_Y - 24, taken: false },
    { x: 1600, y: 290, taken: false },
    { x: 2450, y: GROUND_Y - 24 - 300 + 300, taken: false }, // sits on ground segment
    { x: 3000, y: 310, taken: false },
  ];
  // fix mushroom that should sit on ground segment 3 (x 1860-2760)
  mushrooms[2] = { x: 2500, y: GROUND_Y - 24, taken: false };

  function makeEnemy(x, y, patrolMin, patrolMax) {
    return {
      x, y, w: 30, h: 28,
      vx: -ENEMY_SPEED, vy: 0,
      alive: true,
      patrolMin, patrolMax,
      squashT: 0, // squash-death animation timer
    };
  }

  const enemiesInit = () => ([
    makeEnemy(500, GROUND_Y - 28, 350, 850),
    makeEnemy(1150, 350 - 28, 1130, 1220), // on a platform
    makeEnemy(2000, GROUND_Y - 28, 1900, 2700),
    makeEnemy(2900, GROUND_Y - 28, 2860, 3300),
  ]);

  const FLAG_X = LEVEL_WIDTH - 80;

  // ---------------------------------------------------------------------
  // Night sky decoration (fixed field, twinkles over time)
  // ---------------------------------------------------------------------
  const STARS = Array.from({ length: 90 }, (_, i) => ({
    x: (i * 137) % (LEVEL_WIDTH + VIEW_W),
    y: (i * 53) % (GROUND_Y - 60) + 10,
    r: 1 + (i % 3) * 0.6,
    phase: i * 0.6,
  }));

  // ---------------------------------------------------------------------
  // Player
  // ---------------------------------------------------------------------
  function makePlayer() {
    return {
      x: 60, y: GROUND_Y - 40,
      w: 28, h: 40,
      vx: 0, vy: 0,
      onGround: false,
      facing: 1,
      invuln: 0,
    };
  }

  // ---------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------
  const state = {
    mode: 'playing', // 'playing' | 'gameover' | 'victory'
    score: 0,
    lives: 3,
    cameraX: 0,
  };

  let player = makePlayer();
  let enemies = enemiesInit();

  function resetGame() {
    player = makePlayer();
    enemies = enemiesInit();
    coins.forEach(c => c.taken = false);
    mushrooms.forEach(m => m.taken = false);
    state.mode = 'playing';
    state.score = 0;
    state.lives = 3;
    state.cameraX = 0;
  }

  function respawnAfterDeath() {
    state.lives--;
    if (state.lives <= 0) {
      state.mode = 'gameover';
      return;
    }
    player = makePlayer();
  }

  // ---------------------------------------------------------------------
  // AABB collision helpers
  // ---------------------------------------------------------------------
  function aabbOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Resolve an entity's movement against solids, axis-separated to keep
  // things simple and avoid tunneling corner cases.
  function moveAndCollide(ent, dx, dy) {
    // Horizontal pass
    ent.x += dx;
    for (const s of solids) {
      if (!aabbOverlap(ent, s)) continue;
      if (dx > 0) ent.x = s.x - ent.w;
      else if (dx < 0) ent.x = s.x + s.w;
    }

    // Vertical pass
    ent.y += dy;
    ent.onGroundThisFrame = false;
    for (const s of solids) {
      if (!aabbOverlap(ent, s)) continue;
      if (dy > 0) { ent.y = s.y - ent.h; ent.onGroundThisFrame = true; ent.vy = 0; }
      else if (dy < 0) { ent.y = s.y + s.h; ent.vy = 0; }
    }
  }

  // ---------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------
  function updatePlayer(dt) {
    const p = player;

    // --- Horizontal input / inertia ---
    const accel = p.onGround ? MOVE_ACCEL : AIR_ACCEL;
    if (isDown('left')) { p.vx -= accel * dt; p.facing = -1; }
    else if (isDown('right')) { p.vx += accel * dt; p.facing = 1; }
    else if (p.onGround) {
      // Friction brings the player to a stop when no key is held
      if (p.vx > 0) p.vx = Math.max(0, p.vx - FRICTION * dt);
      else if (p.vx < 0) p.vx = Math.min(0, p.vx + FRICTION * dt);
    }
    p.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, p.vx));

    // --- Jump ---
    if (isDown('jump') && p.onGround) {
      p.vy = JUMP_VELOCITY;
      p.onGround = false;
    }

    // --- Gravity ---
    p.vy += GRAVITY * dt;
    p.vy = Math.min(MAX_FALL_SPEED, p.vy);

    moveAndCollide(p, p.vx * dt, p.vy * dt);
    p.onGround = p.onGroundThisFrame;

    // Level bounds
    if (p.x < 0) p.x = 0;
    if (p.x + p.w > LEVEL_WIDTH) p.x = LEVEL_WIDTH - p.w;

    // Pit death
    if (p.y > KILL_Y) {
      respawnAfterDeath();
      return;
    }

    if (p.invuln > 0) p.invuln -= dt;

    // --- Coins ---
    for (const c of coins) {
      if (c.taken) continue;
      const cBox = { x: c.x - 10, y: c.y - 10, w: 20, h: 20 };
      if (aabbOverlap(p, cBox)) { c.taken = true; state.score += 100; }
    }

    // --- Mushrooms ---
    for (const m of mushrooms) {
      if (m.taken) continue;
      const mBox = { x: m.x - 12, y: m.y - 12, w: 24, h: 24 };
      if (aabbOverlap(p, mBox)) { m.taken = true; state.score += 500; }
    }

    // --- Enemies ---
    for (const en of enemies) {
      if (!en.alive) continue;
      if (!aabbOverlap(p, en)) continue;

      const playerBottom = p.y + p.h;
      const stomping = p.vy > 0 && playerBottom - en.y < en.h * 0.6;

      if (stomping) {
        en.alive = false;
        en.squashT = 0.25;
        p.vy = JUMP_VELOCITY * 0.55; // small bounce after stomping
        state.score += 200;
      } else if (p.invuln <= 0) {
        p.invuln = INVULN_TIME;
        // knockback away from the enemy
        p.vx = (p.x < en.x ? -1 : 1) * 220;
        p.vy = -300;
        respawnAfterDeath();
        return;
      }
    }

    // --- Flag / victory ---
    if (p.x + p.w >= FLAG_X) {
      state.mode = 'victory';
    }
  }

  function updateEnemies(dt) {
    for (const en of enemies) {
      if (!en.alive) {
        en.squashT -= dt;
        continue;
      }

      en.vy += GRAVITY * dt;
      en.vy = Math.min(MAX_FALL_SPEED, en.vy);
      moveAndCollide(en, en.vx * dt, en.vy * dt);

      // Reverse at patrol bounds or when blocked by a wall
      if (en.x <= en.patrolMin) { en.x = en.patrolMin; en.vx = ENEMY_SPEED; }
      if (en.x + en.w >= en.patrolMax) { en.x = en.patrolMax - en.w; en.vx = -ENEMY_SPEED; }
    }
    // Drop fully-squashed enemies out of the array for tidiness
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (!enemies[i].alive && enemies[i].squashT <= -1) enemies.splice(i, 1);
    }
  }

  function updateCamera() {
    let target = player.x + player.w / 2 - VIEW_W / 2;
    target = Math.max(0, Math.min(LEVEL_WIDTH - VIEW_W, target));
    // Smooth follow
    state.cameraX += (target - state.cameraX) * 0.15;
  }

  function update(dt) {
    if (state.mode !== 'playing') return;
    updatePlayer(dt);
    if (state.mode !== 'playing') return;
    updateEnemies(dt);
    updateCamera();
  }

  // ---------------------------------------------------------------------
  // Drawing
  // ---------------------------------------------------------------------
  function drawBackground(t) {
    // Night sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    sky.addColorStop(0, '#05040a');
    sky.addColorStop(0.55, '#0d0a1f');
    sky.addColorStop(1, '#1a1230');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // Twinkling stars (slow parallax)
    const starParallax = state.cameraX * 0.15;
    ctx.fillStyle = '#fff';
    for (const star of STARS) {
      const sx = star.x - starParallax;
      const wrapped = ((sx % (LEVEL_WIDTH + VIEW_W)) + (LEVEL_WIDTH + VIEW_W)) % (LEVEL_WIDTH + VIEW_W);
      if (wrapped > VIEW_W) continue;
      const twinkle = 0.35 + Math.abs(Math.sin(t * 1.6 + star.phase)) * 0.65;
      ctx.globalAlpha = twinkle;
      ctx.beginPath();
      ctx.arc(wrapped, star.y, star.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Pale, sickly moon with a soft glow
    const moonParallax = state.cameraX * 0.08;
    const moonX = VIEW_W * 0.78 - moonParallax % (VIEW_W * 1.4);
    const moonY = 80;
    const glow = ctx.createRadialGradient(moonX, moonY, 10, moonX, moonY, 90);
    glow.addColorStop(0, 'rgba(226, 220, 180, 0.35)');
    glow.addColorStop(1, 'rgba(226, 220, 180, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(moonX - 90, moonY - 90, 180, 180);
    ctx.fillStyle = '#e6dfb8';
    ctx.beginPath();
    ctx.arc(moonX, moonY, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(150, 140, 110, 0.4)';
    ctx.beginPath();
    ctx.arc(moonX - 10, moonY - 8, 6, 0, Math.PI * 2);
    ctx.arc(moonX + 8, moonY + 10, 4, 0, Math.PI * 2);
    ctx.arc(moonX + 12, moonY - 12, 3, 0, Math.PI * 2);
    ctx.fill();

    // Dead black silhouette hills with gnarled tree spikes
    const parallax = state.cameraX * 0.3;
    ctx.fillStyle = '#0a0812';
    for (let i = -1; i < 6; i++) {
      const hx = i * 260 - (parallax % 260);
      ctx.beginPath();
      ctx.arc(hx + 100, GROUND_Y + 20, 90, Math.PI, 0);
      ctx.fill();
      // bare twisted branches jutting from the hill crest
      ctx.strokeStyle = '#0a0812';
      ctx.lineWidth = 3;
      for (let b = 0; b < 3; b++) {
        const bx = hx + 40 + b * 30;
        const by = GROUND_Y - 65;
        ctx.beginPath();
        ctx.moveTo(bx, by + 30);
        ctx.lineTo(bx + 4, by);
        ctx.lineTo(bx - 8, by - 14);
        ctx.moveTo(bx + 4, by);
        ctx.lineTo(bx + 12, by - 12);
        ctx.stroke();
      }
    }

    // Drifting ground fog
    const parallax2 = state.cameraX * 0.5;
    ctx.fillStyle = 'rgba(200, 210, 220, 0.10)';
    for (let i = -1; i < 8; i++) {
      const fx = i * 300 - (parallax2 % 300) + Math.sin(t * 0.3 + i) * 12;
      const fy = GROUND_Y - 30 - (i % 3) * 18;
      drawFogPatch(fx, fy);
    }
  }

  function drawFogPatch(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.arc(x + 26, y - 6, 26, 0, Math.PI * 2);
    ctx.arc(x + 54, y, 22, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSolids() {
    for (const s of solids) {
      const sx = s.x - state.cameraX;
      if (sx + s.w < 0 || sx > VIEW_W) continue;

      const isGround = s.y === GROUND_Y;
      ctx.fillStyle = isGround ? '#2b1f22' : '#3b2740';
      ctx.fillRect(sx, s.y, s.w, s.h);
      // top highlight strip: dead moss / dried blood tint
      ctx.fillStyle = isGround ? '#3a3320' : '#5c2a3a';
      ctx.fillRect(sx, s.y, s.w, 8);
      // cracked texture
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1;
      for (let bx = 0; bx < s.w; bx += 20) {
        ctx.beginPath();
        ctx.moveTo(sx + bx, s.y + 8);
        ctx.lineTo(sx + bx, s.y + s.h);
        ctx.stroke();
      }
    }
  }

  function drawCoins(t) {
    for (const c of coins) {
      if (c.taken) continue;
      const cx = c.x - state.cameraX;
      if (cx < -20 || cx > VIEW_W + 20) continue;
      const squish = Math.abs(Math.sin(t * 4 + c.x));
      ctx.save();
      ctx.translate(cx, c.y);
      ctx.scale(0.3 + squish * 0.7, 1);
      ctx.shadowColor = '#7fffd4';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(170, 255, 230, 0.85)';
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#3fd6b0';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawMushrooms() {
    for (const m of mushrooms) {
      if (m.taken) continue;
      const mx = m.x - state.cameraX;
      if (mx < -24 || mx > VIEW_W + 24) continue;
      // stem
      ctx.fillStyle = '#cbb896';
      ctx.fillRect(mx - 7, m.y, 14, 12);
      // cap
      ctx.fillStyle = '#4a1030';
      ctx.beginPath();
      ctx.arc(mx, m.y, 13, Math.PI, 0);
      ctx.fill();
      // glowing spores
      ctx.shadowColor = '#b98cff';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#d9b8ff';
      ctx.beginPath();
      ctx.arc(mx - 6, m.y - 5, 3, 0, Math.PI * 2);
      ctx.arc(mx + 6, m.y - 5, 3, 0, Math.PI * 2);
      ctx.arc(mx, m.y - 10, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawEnemies() {
    for (const en of enemies) {
      const ex = en.x - state.cameraX;
      if (ex + en.w < 0 || ex > VIEW_W) continue;

      ctx.save();
      if (!en.alive) {
        // squashed death animation: flatten vertically
        ctx.translate(ex, en.y + en.h);
        ctx.scale(1, 0.2);
        ctx.translate(-ex, -(en.y + en.h));
      }

      // body: matte black shadow-creature silhouette
      ctx.fillStyle = '#0c0810';
      ctx.beginPath();
      ctx.ellipse(ex + en.w / 2, en.y + en.h / 2 + 2, en.w / 2, en.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // jagged spikes along its back
      ctx.fillStyle = '#0c0810';
      for (let sp = 0; sp < 3; sp++) {
        const spx = ex + 6 + sp * 9;
        ctx.beginPath();
        ctx.moveTo(spx, en.y + 4);
        ctx.lineTo(spx + 4, en.y - 6);
        ctx.lineTo(spx + 8, en.y + 4);
        ctx.closePath();
        ctx.fill();
      }

      // clawed feet
      ctx.fillStyle = '#050308';
      ctx.fillRect(ex + 2, en.y + en.h - 6, 8, 6);
      ctx.fillRect(ex + en.w - 10, en.y + en.h - 6, 8, 6);

      // sharp teeth
      ctx.fillStyle = '#e8e2ea';
      ctx.beginPath();
      ctx.moveTo(ex + en.w / 2 - 8, en.y + en.h / 2 + 6);
      ctx.lineTo(ex + en.w / 2 - 4, en.y + en.h / 2 + 12);
      ctx.lineTo(ex + en.w / 2, en.y + en.h / 2 + 6);
      ctx.lineTo(ex + en.w / 2 + 4, en.y + en.h / 2 + 12);
      ctx.lineTo(ex + en.w / 2 + 8, en.y + en.h / 2 + 6);
      ctx.closePath();
      ctx.fill();

      // glowing red eyes
      ctx.shadowColor = '#ff2a2a';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff2a2a';
      ctx.beginPath();
      ctx.arc(ex + en.w / 2 - 6, en.y + en.h / 2 - 2, 3.5, 0, Math.PI * 2);
      ctx.arc(ex + en.w / 2 + 6, en.y + en.h / 2 - 2, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.restore();
    }
  }

  function drawFlag() {
    const fx = FLAG_X - state.cameraX;
    if (fx < -20 || fx > VIEW_W + 20) return;
    ctx.fillStyle = '#3a3540';
    ctx.fillRect(fx, GROUND_Y - 220, 6, 220);
    ctx.shadowColor = '#d63447';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#8f2d56';
    ctx.beginPath();
    ctx.moveTo(fx + 6, GROUND_Y - 220);
    ctx.lineTo(fx + 46, GROUND_Y - 205);
    ctx.lineTo(fx + 6, GROUND_Y - 190);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawPlayer() {
    const p = player;
    // Flash while invulnerable
    if (p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0) return;

    const px = p.x - state.cameraX;
    ctx.save();
    ctx.translate(px + p.w / 2, 0);
    ctx.scale(p.facing, 1);
    ctx.translate(-p.w / 2, 0);

    // Legs: dark stockings + boots
    ctx.fillStyle = '#1c1620';
    ctx.fillRect(4, p.y + 26, 20, 14);
    ctx.fillStyle = '#0c0810';
    ctx.fillRect(3, p.y + 36, 10, 5);
    ctx.fillRect(15, p.y + 36, 10, 5);

    // Flared skirt (dark maroon), drawn as a trapezoid
    ctx.fillStyle = '#5c1030';
    ctx.beginPath();
    ctx.moveTo(6, p.y + 14);
    ctx.lineTo(22, p.y + 14);
    ctx.lineTo(26, p.y + 30);
    ctx.lineTo(2, p.y + 30);
    ctx.closePath();
    ctx.fill();

    // Blouse
    ctx.fillStyle = '#e7e1ea';
    ctx.fillRect(4, p.y + 12, 20, 6);

    // Long dark hair falling behind the head/shoulders
    ctx.fillStyle = '#140d18';
    ctx.beginPath();
    ctx.moveTo(3, p.y - 2);
    ctx.quadraticCurveTo(-3, p.y + 20, 2, p.y + 34);
    ctx.lineTo(8, p.y + 32);
    ctx.quadraticCurveTo(4, p.y + 14, 8, p.y - 1);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(21, p.y - 2);
    ctx.quadraticCurveTo(27, p.y + 20, 22, p.y + 34);
    ctx.lineTo(16, p.y + 32);
    ctx.quadraticCurveTo(20, p.y + 14, 16, p.y - 1);
    ctx.closePath();
    ctx.fill();

    // Head
    ctx.fillStyle = '#f0c9a0';
    ctx.fillRect(6, p.y, 16, 14);

    // Hair top + bangs
    ctx.fillStyle = '#140d18';
    ctx.fillRect(4, p.y - 4, 20, 7);
    ctx.fillRect(6, p.y, 5, 5);
    ctx.fillRect(17, p.y, 5, 5);

    // Small bow
    ctx.fillStyle = '#8f2d56';
    ctx.beginPath();
    ctx.arc(24, p.y - 2, 3.2, 0, Math.PI * 2);
    ctx.arc(24, p.y + 4, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5c1030';
    ctx.fillRect(22.5, p.y - 0.5, 3, 3);

    // Eye, given a faint glow for an eerie touch at night
    ctx.shadowColor = '#8f2d56';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#2a1030';
    ctx.fillRect(16, p.y + 4, 3, 4);
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, VIEW_W, 40);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.textBaseline = 'middle';
    ctx.fillText('SCORE: ' + state.score, 16, 22);

    ctx.fillText('LIVES: ' + '❤ '.repeat(Math.max(0, state.lives)).trim(), 260, 22);

    const pct = Math.round(Math.min(100, (player.x / (FLAG_X)) * 100));
    ctx.fillText('PROGRESS: ' + pct + '%', VIEW_W - 220, 22);
  }

  function drawOverlay() {
    if (state.mode === 'playing') return;

    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    ctx.textAlign = 'center';
    ctx.fillStyle = state.mode === 'victory' ? '#ffd23f' : '#e03c31';
    ctx.font = 'bold 48px monospace';
    ctx.fillText(state.mode === 'victory' ? 'YOU WIN!' : 'GAME OVER', VIEW_W / 2, VIEW_H / 2 - 30);

    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Final Score: ' + state.score, VIEW_W / 2, VIEW_H / 2 + 15);
    ctx.fillText('Press ENTER or SPACE to restart', VIEW_W / 2, VIEW_H / 2 + 50);
    ctx.textAlign = 'left';
  }

  function drawVignette(t) {
    const flicker = 0.7 + Math.sin(t * 2.3) * 0.05 + Math.random() * 0.03;
    const grad = ctx.createRadialGradient(
      VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.22,
      VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.75
    );
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${flicker})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  function draw(t) {
    drawBackground(t);
    drawSolids();
    drawMushrooms();
    drawCoins(t);
    drawFlag();
    drawEnemies();
    drawPlayer();
    drawVignette(t);
    drawHUD();
    drawOverlay();
  }

  // ---------------------------------------------------------------------
  // Main loop (fixed-step physics driven by real delta time, clamped to
  // avoid huge jumps if the tab was backgrounded)
  // ---------------------------------------------------------------------
  let lastTime = null;

  function frame(timestamp) {
    if (lastTime === null) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    dt = Math.min(dt, 1 / 30); // clamp so tab-switching doesn't cause tunneling
    lastTime = timestamp;

    update(dt);
    draw(timestamp / 1000);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
